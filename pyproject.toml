[project]
name = "digitalhealthlab-sensitive-ppin"
version = "0.1.0"
description = "Dependency management for the DigitalHealthLabSensitivePPIN repository."
readme = "README.md"
requires-python = ">=3.10,<3.12"
authors = [{ name = "Nunzio" }]
dynamic = ["dependencies"]

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<3.12"
lightning = "2.5.0.post0"
matplotlib = "3.7.5"
networkx = "3.1"
numpy = "1.26.4"
pandas = "2.0.2"
h5py = "3.16.0"
ray = "2.42.0"
requests = ">=2.28,<3.0"
scikit-learn = "1.2.2"
scipy = ">=1.10,<2.0"
seaborn = "0.13.2"
torch = [
    { version = "2.9.1", markers = "sys_platform == 'darwin'" },
    { version = "2.2.0", markers = "sys_platform != 'linux' and sys_platform != 'darwin'" },
    { version = "2.2.0+cu121", source = "pytorch-cu121", markers = "sys_platform == 'linux'" },
]
torch-geometric = "2.7.0"
torchmetrics = "1.6.1"
tqdm = "4.67.1"
wandb = "0.19.5"

[tool.poetry.group.dev.dependencies]
ipykernel = "*"
pandas-stubs = "<2.1"
pytest = "*"
python-pptx = "^1.0.2"

[[tool.poetry.source]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
priority = "explicit"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
